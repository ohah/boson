name: 스피논 문서 배포

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'rspress.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spinon-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Bun 준비
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: 의존성 설치
        run: bun install --frozen-lockfile
      - name: 문서 생성
        run: bun run docs:build
      - name: Pages 준비
        uses: actions/configure-pages@v5
      - name: 정적 파일 올리기
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
