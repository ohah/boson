name: 스피논 문서 배포

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'theme/**'
      - 'rspress.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spinon-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 문서 원본 가져오기
        uses: actions/checkout@v4
        with:
          path: source
      - name: Pages 브랜치 가져오기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Bun 준비
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: 의존성 설치
        working-directory: source
        run: bun install --frozen-lockfile
      - name: 문서 생성
        working-directory: source
        run: bun run docs:build
      - name: Pages 브랜치 갱신
        run: |
          touch source/build/docs-site/.nojekyll
          rsync -a --delete --exclude=.git source/build/docs-site/ site/
          cd site
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='spinon-docs[bot]' -c user.email='spinon-docs@users.noreply.github.com' commit -m '스피논 공식 API 문서 갱신'
            git push origin HEAD:gh-pages
          fi
