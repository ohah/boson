<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>Spinon C01 supported HTML UA baseline</title>
</head>
<body>
  <div id="ua-div"></div>
  <span id="ua-span"></span>
  <a id="ua-anchor" href="#reference">link</a>
  <img id="ua-image" alt="reference image">
  <button id="ua-button" type="button">button</button>
  <input id="ua-input" type="text" value="input">
  <p id="ua-paragraph">paragraph</p>
  <ul id="ua-list"><li id="ua-list-item">item</li></ul>
  <pre id="reference-result"></pre>
  <script>
    (() => {
      const inventory = window.__SPINON_C01_INVENTORY__;
      if (inventory?.schema !== "spinon-css-feature-inventory/v1"
        || inventory.fixtureId !== "C01-UAv0-supported-html-elements"
        || inventory.profileId !== "spinon-html-ua/0.1.0-draft") {
        throw new Error("C01 feature inventory가 주입되지 않았거나 fixture와 맞지 않습니다.");
      }
      const cases = inventory.elements;
      window.__SPINON_C01_CASES__ = cases;
      const observe = () => cases.map(({ selector, features }) => {
        const matches = Array.from(document.querySelectorAll(selector));
        return {
          selector,
          features,
          matches: matches.map((element) => ({
            id: element.id,
            tag: element.localName,
            namespace: element.namespaceURI,
            computed: Object.fromEntries(
              features.map(({ property }) => [
                property,
                getComputedStyle(element).getPropertyValue(property),
              ]),
            ),
          })),
        };
      });
      window.__SPINON_C01_OBSERVE__ = observe;
      const observation = {
        fixtureId: inventory.fixtureId,
        inventoryId: inventory.inventoryId,
        inventorySchema: inventory.schema,
        profileId: inventory.profileId,
        viewport: {
          width: window.innerWidth,
          height: window.innerHeight,
          deviceScaleFactor: window.devicePixelRatio,
        },
        locale: navigator.language,
        intlLocale: Intl.DateTimeFormat().resolvedOptions().locale,
        documentLanguage: document.documentElement.lang,
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        userAgent: navigator.userAgent,
        media: {
          prefersColorSchemeDark: matchMedia("(prefers-color-scheme: dark)").matches,
          prefersReducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
          forcedColors: matchMedia("(forced-colors: active)").matches,
        },
        authorStyleSheetCount: document.styleSheets.length,
        elements: observe(),
      };
      const bytes = new TextEncoder().encode(JSON.stringify(observation));
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      document.querySelector("#reference-result").textContent = btoa(binary);
    })();
  </script>
</body>
</html>
