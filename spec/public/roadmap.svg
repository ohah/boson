<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">스피논 구현 관문 의존 관계</title>
  <desc id="desc">위험 검증과 세 플랫폼 수직 구현을 거쳐 첫 앱을 만든다. 이후 렌더러 품질과 프레임워크 도구의 독립 작업을 병렬로 진행하며 배포·출시를 준비한다. 첫 공식 릴리스에 포함할 기능 범위는 아직 미정이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4f5d75" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="598" rx="8" fill="#f5f5f5" stroke="#d8d9de"/>
  <text x="42" y="48" fill="#4f5d75" font-family="Geist, Noto Sans KR, sans-serif" font-size="14" font-weight="600">구현 관문의 선후 관계</text>
  <text x="918" y="48" text-anchor="end" fill="#7a8399" font-family="Geist Mono, monospace" font-size="12">SPINON / ROADMAP</text>
