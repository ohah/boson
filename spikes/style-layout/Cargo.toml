[package]
name = "spinon-style-layout-spike"
version = "0.1.0"
edition = "2021"

[lib]
name = "spinon_style_layout_spike"
path = "src/lib.rs"

[[bin]]
name = "spinon-style-layout-spike"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
